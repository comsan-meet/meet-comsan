    <path fill-rule="evenodd" d="M 350 710 V 582 C 350 510 408 467 480 467 C 552 467 610 510 610 582 V 710 H 350 Z M 387 674 H 573 V 582 C 573 531 531 503 480 503 C 429 503 387 531 387 582 V 674 Z" />
  </g>
  
